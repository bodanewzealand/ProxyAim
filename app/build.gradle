plugins {
    id 'com.android.application'
}

android {
    namespace 'com.proxyaim.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.proxyaim.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.appcompat:appcompat:1.6.1'
    }
}
